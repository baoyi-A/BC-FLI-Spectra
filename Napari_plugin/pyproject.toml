[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ---------- Project metadata (PEP 621) ----------
[project]
name = "bc-flim-spectra"
# Using setuptools_scm for versioning:
# declare it as dynamic so tools don't expect a hard-coded value here.
description = "Spectral-lifetime barcode decoding for FLIM images: a napari plugin"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{ name = 'Baoyi Wang', email = "wang.baoyi@stu.pku.edu.cn" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: napari",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Image Processing",
]
version = "0.1.0"
# Runtime deps read by pip install . / -e .
dependencies = [
  # Upper bound is real: napari >= 0.5 removed QtViewer._remove_layer, which the
  # OpenGL crash patch wraps, and the widget layout targets the 0.4.x Qt viewer.
  "napari>=0.4.19,<0.5",
  "numpy>=1.23",
  "scipy>=1.12",
  "scikit-image>=0.20",
  "scikit-learn>=1.2",
  "pandas>=2.0,<2.2",
  "opencv-python>=4.10",
  "tifffile>=2021.7",
  "pillow>=10.4",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "qtpy>=2.4",
  "tqdm>=4.66",
  "magicgui>=0.8",
  "matplotlib>=3.7",
  # Imported by _widget.py / _finetune_runner.py at runtime. These were missing,
  # so a clean `pip install -e .` produced a plugin that raised ImportError on the
  # first PTU read (ptufile), on any segmentation (cellpose, torch) and on the
  # sample-data download (gdown, requests).
  # pandas needs openpyxl to write FLIM-S.xlsx / clustered.xlsx. Without it every
  # cell is computed and then the write fails.
  "openpyxl>=3.1",
  "ptufile>=0.1",
  "requests>=2.28",
  "gdown>=5.0",
]

[project.optional-dependencies]
# Segmentation and fine-tuning. Kept optional because torch must match the user's
# CUDA driver: install torch first from https://pytorch.org/get-started/locally/,
# then `pip install -e ".[segmentation]"`. The plugin imports cellpose lazily, so
# PTU reading, Calculate FLIM-S and Seeded K-Means work without this extra.
segmentation = [
  "torch>=2.0",
  "cellpose>=2.2",
]

# harmonypy is needed only for the optional SeededKMeans / Harmony calibration
# step, so it is declared as an extra rather than a runtime dependency:
#   pip install "bc-flim-spectra[harmony]"
harmony = ["harmonypy>=0.0.9", "scikit-learn>=1.2"]
testing = ["tox", "pytest", "pytest-cov", "pytest-qt", "napari", "pyqt5"]

[project.urls]
Homepage = "https://github.com/baoyi-A/BC-FLI-Spectra"
Issues = "https://github.com/baoyi-A/BC-FLI-Spectra/issues"

# Let napari discover your plugin manifest (napari.yaml).
# Put your napari.yaml under the top-level package `flim_s_gen/`.
[project.entry-points."napari.manifest"]
# This key MUST match the `name:` field of src/flim_s_gen/napari.yaml,
# otherwise napari will not register the plugin.
bc-flim-spectra = "flim_s_gen:napari.yaml"



# ---------- Package discovery for src-layout ----------
# Tell setuptools to find packages under src/
[tool.setuptools.packages.find]
where = ["src"]

# Include data files like napari.yaml inside your package
[tool.setuptools.package-data]
flim_s_gen = ["napari.yaml", "**/*.yaml", "**/*.json", "**/*.csv", "resources/*.png", "resources/*.svg", "resources/*.ico"]

# Alternatively (especially with setuptools_scm), include all git-tracked files:
# [tool.setuptools]
# include-package-data = true

# ---------- Code style / lint ----------
[tool.black]
line-length = 79
target-version = ['py38', 'py39', 'py310']

[tool.ruff]
line-length = 79
select = [
    "E", "F", "W", # flake8
    "UP",          # pyupgrade
    "I",           # isort
    "BLE",         # flake8-blind-exception
    "B",           # flake8-bugbear
    "A",           # flake8-builtins
    "C4",          # flake8-comprehensions
    "ISC",         # flake8-implicit-str-concat
    "G",           # flake8-logging-format
    "PIE",         # flake8-pie
    "SIM",         # flake8-simplify
]
ignore = [
    "E501",
    "UP006", "UP007",
    "SIM117",
]
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".mypy_cache", ".pants.d",
    ".ruff_cache", ".svn", ".tox", ".venv", "__pypackages__", "_build",
    "buck-out", "build", "dist", "node_modules", "venv",
    "*vendored*", "*_vendor*",
]
target-version = "py38"
fix = true
